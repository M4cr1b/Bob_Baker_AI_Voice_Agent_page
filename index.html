<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order by Voice - Bob Baker's Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed@beta" async type="text/javascript"></script>

    <style>
        /* --- CSS STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-brown: #8D6E63;
            --dark-brown: #5D4037;
            --accent-orange: #D97706;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            overflow: hidden; 
        }

        .brand-container {
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease;
        }

        .logo-icon {
            font-size: 3rem;
            color: var(--accent-orange);
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            padding: 0 20px;
            animation: fadeInUp 1s ease 0.2s backwards;
        }

        p.instruction {
            font-size: 1.2rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            max-width: 600px;
            padding: 0 20px;
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        .cta-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fadeInUp 1s ease 0.6s backwards;
        }

        .cta-text {
            background: var(--accent-orange);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
        }

        .arrow-down {
            font-size: 2rem;
            color: white;
            animation: bounce 2s infinite;
        }

        /* --- RESPONSIVE WIDGET STYLING --- */
        elevenlabs-convai {
            position: fixed;
            left: 50%; /* Center horizontally */
            z-index: 999;
            
            /* Default Desktop Positioning */
            bottom: 30px;
            transform: translateX(-50%);
            transition: transform 0.3s ease; /* Smooth resizing */
        }

        /* Mobile & Tablet Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .logo-icon { font-size: 2.5rem; }
            
            elevenlabs-convai {
                /* Move up slightly to avoid phone navigation bars */
                bottom: 50px; 
                
                /* Scale up the button by 20% for easier touch access */
                transform: translateX(-50%) scale(1.2); 
            }
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <i class="fa-solid fa-bread-slice logo-icon"></i>
        <div class="brand-name">Bob Baker's Bakery</div>
    </div>

    <h1>Skip the typing.<br>Just ask.</h1>
    
    <p class="instruction">
        Our AI assistant is ready to take your order, answer questions, 
        and check stock instantly.
    </p>

    <div class="cta-indicator">
        <div class="cta-text">Tap the microphone below to start</div>
        <i class="fa-solid fa-arrow-down arrow-down"></i>
    </div>

    <elevenlabs-convai agent-id="agent_6201k694r5hne2e9z77vkqwmgq22"></elevenlabs-convai>

</body>
</html>
