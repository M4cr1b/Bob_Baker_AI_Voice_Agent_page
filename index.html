<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Order by Voice - Bob Baker's Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed@beta" async type="text/javascript"></script>

    <style>
        /* --- CSS STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-brown: #8D6E63;
            --dark-brown: #5D4037;
            --accent-orange: #D97706;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Use dvh (dynamic viewport height) for better mobile browser support */
            min-height: 100vh;
            min-height: 100dvh; 
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Parallax effect on desktop, robust on mobile */
            overflow-x: hidden;
            
            /* Add padding to prevent content touching edges on small screens */
            padding: 20px;
        }

        .brand-container {
            /* Responsive margin using vh */
            margin-bottom: 4vh;
            animation: fadeInDown 1s ease;
        }

        .logo-icon {
            /* Scales between 2.5rem and 4rem depending on screen width */
            font-size: clamp(2.5rem, 5vw, 4rem); 
            color: var(--accent-orange);
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            /* Scales between 2.2rem and 4.5rem */
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 2vh;
            max-width: 900px;
            animation: fadeInUp 1s ease 0.2s backwards;
        }

        p.instruction {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            margin-bottom: 5vh;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.6;
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        .cta-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeInUp 1s ease 0.6s backwards;
            margin-bottom: 80px; /* Make room for the button */
        }

        .cta-text {
            background: var(--accent-orange);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
            white-space: nowrap;
        }

        .arrow-down {
            font-size: 2rem;
            color: white;
            animation: bounce 2s infinite;
        }

        /* --- RESPONSIVE WIDGET STYLING --- */
        elevenlabs-convai {
            position: fixed;
            left: 50%;
            z-index: 999;
            transform: translateX(-50%);
            
            /* Responsive Bottom Spacing */
            bottom: 30px; 
            bottom: max(30px, env(safe-area-inset-bottom) + 10px); /* iPhone Home Bar Safe Area */
        }

        /* --- MEDIA QUERIES --- */

        /* Mobile Devices (Portrait) */
        @media (max-width: 480px) {
            h1 {
                line-height: 1.2;
            }
            
            elevenlabs-convai {
                transform: translateX(-50%) scale(1.15); /* Make button larger on phone */
            }
        }

        /* Mobile Landscape (Short vertical space) */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                justify-content: flex-start;
                padding-top: 20px;
                height: auto; /* Allow scrolling if needed */
            }
            
            .brand-container { margin-bottom: 10px; }
            h1 { margin-bottom: 10px; }
            p.instruction { margin-bottom: 20px; }
            
            elevenlabs-convai {
                 /* Keep button usable but not intrusive in landscape */
                bottom: 15px;
                transform: translateX(-50%) scale(0.9);
            }
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <i class="fa-solid fa-bread-slice logo-icon"></i>
        <div class="brand-name">Bob Baker's Bakery</div>
    </div>

    <h1>Skip the typing.<br>Just ask.</h1>
    
    <p class="instruction">
        Our AI assistant is ready to take your order, answer questions, 
        and check stock instantly.
    </p>

    <div class="cta-indicator">
        <div class="cta-text">Tap the microphone below to start</div>
        <i class="fa-solid fa-arrow-down arrow-down"></i>
    </div>

    <elevenlabs-convai agent-id="agent_7601kcjkk2hsfc5t25pk5adf0cw2"></elevenlabs-convai>

</body>
</html>
